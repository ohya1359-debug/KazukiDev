<!DOCTYPE html>
<html>
    <head>
        <title></title>
        <link rel="stylesheet" href="general.css">
        <link rel="stylesheet" href="header.css">
        <link rel="stylesheet" href="content.css">
        <link rel="stylesheet" href="sidebar.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Exile&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>

    <body>
        <header class="header">
            <div class="service-area">
                <img class="logo" src="icon.PNG">
                <p class="service-name">Kazuki Dev</p>
            </div>
            <div class="action-area">
                <button class="login-button">Login</button>

        </header>

        <nav class="sidebar">

        </nav>

        <main>
            <div class="contents">
                <div class="card">
                    <div class="thumbnail-container">
                        <img class="thumbnail" src="thumbnails/note-thumbnail.webp">
                    </div>
                    <div class="info-zone">
                        <div class="icon-column">
                            <img class="service-icon" src="icons/note.png">
                        </div>
                        <div class="info-right-side">
                            <p class="title">
                                間違ったプライド。留学5ヶ月目で気づいた、 僕が勘違いしていた英語の学び方
                            </p>   
                            <button class="cta-button">

                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="thumbnail-container">
                        <img class="thumbnail" src="thumbnails/muscle-stamp-thumbnail.png">
                    </div>
                    <div class="info-zone">
                        <div class="icon-column">
                            <img class="service-icon" src="icons/musclestamp-icon.png">
                        </div>
                        <div class="info-right-side">
                            <p class="title">
                                筋トレ記録が1タップで終わる！新しい筋トレ記録アプリ登場。
                            </p>   
                            <button class="cta-button">
                                💪 Try now
                            </button>                    
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="thumbnail-container">
                        <img class="thumbnail" src="thumbnails/indiepick-thumbnail.jpg">
                    </div>
                    <div class="info-zone">
                        <div class="icon-column">
                            <img class="service-icon" src="icons/indiepicks-icon.png">
                        </div>
                        <div class="info-right-side">
                            <p class="title">
                                インディーピックスで未体験の海外インディーゲームに出会おう！
                            </p>   
                            <button class="cta-button">
                                🌏 Explore now
                            </button>                    
                        </div>
                    </div>
                </div>

            </div>
        </main>
